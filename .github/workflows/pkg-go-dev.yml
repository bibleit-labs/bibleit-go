name: Publish Go package documentation

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Published SDK tag to index (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pkg-go-dev-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MODULE: github.com/bibleit-labs/bibleit-go
      VERSION: ${{ inputs.version || github.ref_name }}
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate release version
        shell: bash
        run: |
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
      - name: Fetch published module through the public Go proxy
        run: go mod download -json "$MODULE@$VERSION"
      - name: Request pkg.go.dev indexing
        run: |
          if curl --fail --silent --location --max-time 30 --output /dev/null \
            "https://pkg.go.dev/$MODULE@$VERSION"; then
            echo 'Version is already indexed'
          else
            # A fetch can outlive the HTTP request; the availability check below
            # is the final success condition, even if this request times out.
            curl --fail --show-error --silent --max-time 30 --request POST \
              "https://pkg.go.dev/fetch/$MODULE@$VERSION" || \
              echo 'Indexing request did not finish; waiting for documentation'
          fi
      - name: Verify versioned documentation is available
        run: |
          curl --fail --show-error --silent --location --max-time 30 \
            --retry 8 --retry-all-errors --retry-delay 15 --output /dev/null \
            "https://pkg.go.dev/$MODULE@$VERSION"
          printf 'Published documentation: https://pkg.go.dev/%s@%s\n' \
            "$MODULE" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
