name: Native Go client validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Verify generated REST contract bindings
        if: runner.os == 'Linux'
        run: |
          go generate .
          git diff --exit-code -- models.gen.go operations.gen.go
      - name: Prepare Windows race compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            $compilerDir = @('C:\mingw64\bin', 'C:\msys64\ucrt64\bin', 'C:\msys64\mingw64\bin') |
              Where-Object { Test-Path (Join-Path $_ 'gcc.exe') } | Select-Object -First 1
            if (-not $compilerDir) { throw 'Native Go race tests require MinGW GCC' }
            $compilerDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Race tests
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Build examples
        run: go build ./...
